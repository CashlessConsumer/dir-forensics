# Demo case — zero-setup. Run: python -m arbor.cli demo cases/demo.yaml
#
# The `demo` command generates a synthetic inventory JSON at `inventory`
# before running the full pipeline. All data is fictional.

case: acme-demo
label: acme-corp.example.org
root_url: http://demo.example.org

# Auto-generated by `demo` command:
inventory: demo-output/inventory.json
output_dir: demo-output
duckdb: demo-output/acme-demo.duckdb

# Auto-load the default flag ruleset (9 categories, 60+ patterns)
flags_source: default

# Clean defaults
exclude_dirs: []
exclude_path: []

tier0:
  budget_rows_per_request: 50
