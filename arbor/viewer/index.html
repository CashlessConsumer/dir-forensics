<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbor — {{CASE}}</title>
  <link rel="stylesheet" href="/__viewer/styles.css">
</head>
<body>
  <header>
    <img src="/__viewer/logo.svg" alt="Arbor" class="logo">
    <h1>Arbor</h1>
    <span class="case-badge">{{CASE}}</span>
    <span class="meta">metadata-only directory forensics</span>
    <span style="margin-left:auto;cursor:pointer;user-select:none" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">🌓</span>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="tree">Tree</button>
    <button class="tab" data-tab="flags">Flags</button>
    <button class="tab" data-tab="ext">Extensions</button>
    <button class="tab" data-tab="depth">Depth</button>
    <button class="tab" data-tab="dupes">Duplicates</button>
  </nav>

  <main>
    <!-- Overview -->
    <section id="tab-overview" class="tab-panel active">
      <div class="grid" id="overview-cards"></div>
      <div id="tier0-panel"></div>
    </section>

    <!-- Tree -->
    <section id="tab-tree" class="tab-panel">
      <div class="controls"><input class="search-input" id="tree-filter" placeholder="Filter tree nodes..."></div>
      <div id="tree-container"></div>
    </section>

    <!-- Flags -->
    <section id="tab-flags" class="tab-panel">
      <div id="flags-summary"></div>
      <div class="card" style="margin-bottom:1rem"><div id="flags-chart"></div></div>
      <div id="flags-table"></div>
    </section>

    <!-- Extensions -->
    <section id="tab-ext" class="tab-panel">
      <div class="controls"><input class="search-input" id="ext-filter" placeholder="Filter extensions..."></div>
      <div class="card" style="margin-bottom:1rem"><div id="ext-chart"></div></div>
      <div id="ext-table"></div>
    </section>

    <!-- Depth -->
    <section id="tab-depth" class="tab-panel">
      <div class="card" style="margin-bottom:1rem"><div id="depth-chart"></div></div>
      <div id="depth-table"></div>
    </section>

    <!-- Duplicates -->
    <section id="tab-dupes" class="tab-panel">
      <div class="controls"><input class="search-input" id="dupes-filter" placeholder="Filter duplicates..."></div>
      <div id="dupes-summary"></div>
      <div id="dupes-list"></div>
    </section>
  </main>

  <footer>
    Generated by <a href="https://github.com/CashlessConsumer/arbor">Arbor</a> · metadata-only · no file contents accessed
  </footer>

  <script>CASE = "{{CASE}}";</script>
  <script src="/__viewer/app.js"></script>
</body>
</html>
