name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Compile check
        run: python -m py_compile arbor/*.py arbor/adapters/*.py

      - name: Import check
        run: python -c "import arbor; import arbor.cli; print('OK')"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test: demo pipeline
        run: |
          python -m arbor.cli demo cases/demo.yaml -v
          python -c "import json; d=json.load(open('cases/demo-output/acme-demo-stats.json')); assert d['stats']['files'] > 0; print(f'demo: {d[\"stats\"][\"files\"]} files')"

      - name: Smoke test: local FS adapter
        run: |
          python -m arbor.adapters.local_fs . --out /tmp/inv.json --max-depth 3
          python -c "import json; d=json.load(open('/tmp/inv.json')); assert d['stats']['files'] > 0; print(f'local_fs: {d[\"stats\"][\"files\"]} files')"
