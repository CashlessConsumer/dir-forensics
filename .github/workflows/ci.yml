name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Compile check
        run: python -m py_compile dirforensics/*.py dirforensics/adapters/*.py

      - name: Import check
        run: python -c "import dirforensics; import dirforensics.cli; print('OK')"

      - name: Local FS adapter smoke test
        run: |
          python -m dirforensics.adapters.local_fs . --out /tmp/inv.json --max-depth 3
          python -c "import json; d=json.load(open('/tmp/inv.json')); assert d['stats']['files'] > 0; print(f'OK: {d[\"stats\"][\"files\"]} files')"
